name: Python package

on:
  push:
    branches-ignore:
      - 'dependabot/**'
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"  # Canonical versioned tags
      - "[0-9]+.[0-9]+.[0-9]+.post[0-9]+"  # Canonical rebuild tags
  pull_request:
    paths:
      - "sqlalchemy_jsonfield/**"
      - "pyproject.toml"
      - "MANIFEST.in"
      - "README.rst"
      - "LICENSE"
      - "classifiers.txt"
      - "requirements.txt"
      - "test/**"
      - "pytest_requirements.txt"
      - "codecs-requirements.txt"
      - "codecs-gil-requirements.txt"
      - ".github/workflows/pythonpackage.yml"

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Ruff-format:
    name: Validate formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check code style with ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "format --check"

  Ruff:
    name: Check with Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint with ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "check --output-format github"

  PyLint:
    name: Check with pylint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
      - name: Create virtual environment
        run: uv venv --python 3.14
      - name: Install package
        run: uv pip install -e .
      - name: Install dependencies
        run: uv pip install --upgrade -r pylint-requirements.txt
      - name: Lint with pylint
        run: uv run --no-project pylint --output-format=github sqlalchemy_jsonfield

  Mypy:
    name: Check with mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
      - name: Create virtual environment
        run: uv venv --python 3.14
      - name: Install package
        run: uv pip install -e .
      - name: Install dependencies
        run: uv pip install --upgrade -r mypy-requirements.txt
      - name: Type check with mypy
        run: uv run --no-project mypy sqlalchemy_jsonfield

  Pyrefly:
    name: Check with Pyrefly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
      - name: Create virtual environment
        run: uv venv --python 3.14
      - name: Install package
        run: uv pip install -e .
      - name: Install dependencies
        run: uv pip install --upgrade -r pyrefly-requirements.txt -r pytest_requirements.txt
      - name: Type check with Pyrefly
        run: uv run --no-project pyrefly check --output-format full-text-with-github

  Test:
    needs: [ Ruff-format, Ruff, PyLint, Mypy, Pyrefly ]
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 6
      matrix:
        os: [ "ubuntu-latest", "windows-latest" ]
        # A "t" suffix selects the free-threaded (PEP 703, --disable-gil) build.
        # TODO: restore "3.15" and "3.15t" when SQLAlchemy stops crashing on them.
        # python-version: [ "3.11", "3.12", "3.13", "3.14", "3.15", "3.13t", "3.14t", "3.15t", "pypy3.11" ]
        python-version: [ "3.11", "3.12", "3.13", "3.14", "3.13t", "3.14t", "pypy3.11" ]

    name: "Python ${{ matrix.python-version }} on ${{ matrix.os }}"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # need for setuptools_scm
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
      - name: Create virtual environment
        run: uv venv --python-preference only-system --python ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv pip install -r pytest_requirements.txt
      - name: Install alternative JSON libraries
        run: uv pip install -r codecs-requirements.txt
      - name: Install alternative JSON libraries (CPython with GIL only)
        if: ${{ !endsWith(matrix.python-version, 't') }}
        run: uv pip install -r codecs-gil-requirements.txt
      - name: Install package
        run: uv pip install -e .
      - name: Test
        run: uv run --no-project python -m pytest --cov-report=term --cov-report=xml
      - name: Coveralls Parallel
        uses: coverallsapp/github-action@v2
        with:
          flag-name: run-${{ matrix.python-version }}-${{ matrix.os }}
          parallel: true
          file: coverage.xml

  UploadCoverage:
    name: Upload coverage to Coveralls
    needs: [ Test ]
    if: ${{ always() }}
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true

  Build:
    name: Build distribution
    needs: [ Test ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # need for setuptools_scm
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
      - name: Build dist
        run: uv build
      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.tar.gz
          name: built-sdist
          retention-days: 3
      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.whl
          name: built-bdist
          retention-days: 3

  Metadata:
    name: Validate metadata
    runs-on: ubuntu-latest
    needs: [ Build ]
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: built-*
          merge-multiple: true
          path: dist
      - name: Validate metadata
        run: uvx twine check --strict dist/*

  Deploy:
    needs: [ Build, Metadata ]
    if: >-
      github.event_name == 'push' && github.ref_type == 'tag'
      && github.repository == 'penguinolog/sqlalchemy_jsonfield'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/SQLAlchemy-JSONField
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
      contents: read
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: built-*
          merge-multiple: true
          path: dist
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
