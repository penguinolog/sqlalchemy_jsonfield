[tox]
requires =
  tox>=4.57
  tox-uv>=1
envlist =
  py31{1,2,3,4,5}
  py31{3,4,5}t
  pypy311
  ruff
  pylint
  mypy
  pyrefly
  refurb
skip_missing_interpreters = True

[testenv]
usedevelop = true
# In a parallel run (tox -p) unit tests wait for the static checks, so a broken change fails before the test load starts.
depends =
  ruff
  pylint
  mypy
  pyrefly
  refurb
dependency_groups =
  pytest
  codecs
  !py313t-!py314t-!py315t: codecs-gil
commands =
  pytest {posargs}
setenv =
  PYTHONWARNDEFAULTENCODING=1

[testenv:pypy311]
# Alternative implementations run after every CPython environment.
depends =
  {[testenv]depends}
  py31{1,2,3,4,5}
  py31{3,4,5}t

[testenv:functional]
# Needs running MariaDB/MySQL and PostgreSQL, see docker-compose.yml.
depends =
dependency_groups = functional
commands =
  pytest --no-cov {posargs:functional_test}

[testenv:readme]
skip_install = true
depends =
dependency_groups = build
commands =
  python -m build
  twine check --strict {toxinidir}/dist/*

[testenv:ruff]
skip_install = true
depends =
dependency_groups = ruff
commands =
  ruff format --check .
  ruff check .

[testenv:pylint]
base_python = py314
depends = ruff
dependency_groups = pylint
commands = pylint sqlalchemy_jsonfield

[testenv:refurb]
depends = ruff
deps = refurb
commands = refurb sqlalchemy_jsonfield

[testenv:mypy]
base_python = py314
depends = ruff
dependency_groups = mypy
commands = mypy sqlalchemy_jsonfield

[testenv:pyrefly]
base_python = py314
depends = ruff
# Tests are type checked too: pytest is required for the fixtures.
dependency_groups =
  pyrefly
  pytest
commands = pyrefly check
